<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Ícone -->
    <linearGradient id="pistoesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ccff" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <!-- Gradiente do Texto -->
    <linearGradient id="textoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cccccc" />
    </linearGradient>
  </defs>

  <!-- Fundo Escuro -->
  <rect width="100%" height="100%" fill="#0d0d0d" rx="12" />

  <!-- Ícone Automotivo: Pistão & Asas de Velocidade -->
  <g transform="translate(40, 25)">
    <!-- Asas de Velocidade Aerodinâmicas -->
    <path d="M10 110 L90 30 L70 30 L0 100 Z" fill="#ff5500" opacity="0.8"/>
    <path d="M30 130 L110 50 L90 50 L20 120 Z" fill="#00ccff"/>
    
    <!-- Engrenagem / Escudo de Fundo -->
    <circle cx="90" cy="85" r="45" fill="none" stroke="#2a2a2a" stroke-width="8" stroke-dasharray="12, 6"/>
    
    <!-- Pistão Central -->
    <rect x="75" y="55" width="30" height="35" rx="4" fill="url(#pistoesGrad)"/>
    <path d="M70 50 L110 50 L105 40 L75 40 Z" fill="#ffffff"/>
    <rect x="85" y="90" width="10" height="35" fill="#e6e6e6"/>
    <circle cx="90" cy="72" r="5" fill="#0d0d0d"/>
  </g>

  <!-- Tipografia do Nome -->
  <g transform="translate(180, 85)">
    <!-- OSVALDO -->
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="48" font-style="italic" fill="url(#textoGrad)" letter-spacing="2">
      OSVALDO
    </text>
    
    <!-- MOTORS -->
    <text x="0" y="42" font-family="'Arial', sans-serif" font-weight="900" font-size="32" font-style="italic" fill="#ff5500" letter-spacing="6">
      MOTORS
    </text>

    <!-- Subtítulo / Tagline -->
    <text x="2" y="65" font-family="'Arial', sans-serif" font-size="12" fill="#00ccff" letter-spacing="4" font-weight="bold">
      OFICINA MOCÂNICA &amp; PERFORMANCE
    </text>
  </g>

  <!-- Linha de Aceleração -->
  <line x1="180" y1="160" x2="550" y2="160" stroke="#ff5500" stroke-width="3" stroke-dasharray="150, 10, 30, 10"/>
</svg>
